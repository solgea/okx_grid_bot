name: CI

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        run: pytest -q
      - name: Docker build
        run: docker build -t okx-grid-bot:ci .
      - name: Docker runtime smoke (OKX Demo read-only)
        run: |
          set -euo pipefail
          test -n "$OKX_DEMO_API_KEY"
          test -n "$OKX_DEMO_API_SECRET"
          test -n "$OKX_DEMO_PASSPHRASE"
          docker run --rm \
            -e API_KEY \
            -e API_SECRET \
            -e PASSPHRASE \
            -e IS_DEMO=true \
            -e DRY_RUN=true \
            -e SYMBOL=ETH/USDT:USDT \
            -e PYTHONPATH=/app \
            okx-grid-bot:ci \
            python scripts/okx_read_only_bootstrap.py
        env:
          API_KEY: ${{ secrets.OKX_DEMO_API_KEY }}
          API_SECRET: ${{ secrets.OKX_DEMO_API_SECRET }}
          PASSPHRASE: ${{ secrets.OKX_DEMO_PASSPHRASE }}
          OKX_DEMO_API_KEY: ${{ secrets.OKX_DEMO_API_KEY }}
          OKX_DEMO_API_SECRET: ${{ secrets.OKX_DEMO_API_SECRET }}
          OKX_DEMO_PASSPHRASE: ${{ secrets.OKX_DEMO_PASSPHRASE }}

      # Phase 2 — main validation trigger
