name: CI

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        run: pytest -q
      - name: Docker build
        run: docker build -t okx-grid-bot:ci .
      - name: Docker runtime smoke (demo / dry-run only)
        run: |
          set +e
          timeout --signal=TERM 30s docker run --rm \
            -e IS_DEMO=true \
            -e DRY_RUN=true \
            -e LIVE_TRADING_ENABLED=false \
            -e LIVE_TRADING_AUTHORIZED=false \
            -e EMERGENCY_FLATTEN_ENABLED=false \
            -e EMERGENCY_FLATTEN_AUTHORIZED=false \
            -e KILL_SWITCH_ACTIVE=true \
            okx-grid-bot:ci
          rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "Docker runtime smoke PASS: container remained running for 30s."
            exit 0
          fi
          echo "Docker runtime smoke FAIL: container exited before timeout (rc=$rc)."
          exit "$rc"

      # Phase 2 — main validation trigger
