name: Phase A Shadow Evidence

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shadow-evidence:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      PHASE_A_SYMBOL: ETH/USDT:USDT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run controlled Phase-A shadow evidence
        run: python scripts/record_phase_a_evidence.py
      - name: Verify evidence provenance and internal consistency
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          day = datetime.now(timezone.utc).date().isoformat()
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          evidence_id = f"{day}-run-{run_id}-attempt-{attempt}.json"
          p = Path("artifacts/phase_a") / evidence_id
          d = json.loads(p.read_text(encoding="utf-8"))

          assert d["schema"] == "phase-a-evidence.v3"
          assert d["evidence_id"] == evidence_id
          assert d["date_utc"] == day
          assert d["phase"] == "A"
          assert d["transport"] == "NullTransport"
          assert d["exchange_touched"] is False
          assert d["exchange_mutation_calls"] == 0
          assert d["exchange_order_call_observation"]["value"] == 0
          assert d["exchange_order_call_observation"]["basis"] == "structural"
          assert d["workflow_run_id"] == run_id
          assert d["workflow_run_attempt"] == attempt
          assert d["workflow_event"] == os.environ["GITHUB_EVENT_NAME"]
          assert d["workflow_event"] in ("schedule", "workflow_dispatch")
          assert d["git_sha"] == os.environ["GITHUB_SHA"]
          assert d["intent_count"] == d["null_transport_place_calls"] == d["journal_event_count"] == 3
          assert d["counts_consistent"] is True
          assert d["sequence_scope"] == "daily_synthetic_validation"
          assert d["sequence_continuity_proven"] is False
          assert d["acceptance"]["daily_shadow_run"] is True
          assert d["acceptance"]["null_transport_only"] is True
          assert d["acceptance"]["unexpected_exchange_order_calls"] == 0
          assert d["acceptance"]["unresolved_incidents"] == 0
          assert d["incidents"] == []
          print("PHASE_A_EVIDENCE=PASS")
          print(f"PHASE_A_EVIDENCE_PATH={p}")
          PY
      - name: Commit run-scoped evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/phase_a/
          if git diff --cached --quiet; then
            echo "No new evidence to commit."
            exit 0
          fi
          git commit -m "chore: record Phase A run-scoped shadow evidence"
          git push
