name: Phase A Shadow Evidence

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shadow-evidence:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      PHASE_A_SYMBOL: ETH/USDT:USDT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run controlled Phase-A shadow evidence
        run: python scripts/record_phase_a_evidence.py
      - name: Verify evidence is mutation-free
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path("artifacts/phase_a") / f"{datetime.now(timezone.utc).date().isoformat()}.json"
          d = json.loads(p.read_text())
          assert d["phase"] == "A"
          assert d["transport"] == "NullTransport"
          assert d["exchange_touched"] is False
          assert d["exchange_mutation_calls"] == 0
          assert d["acceptance"]["unresolved_incidents"] == 0
          print("PHASE_A_EVIDENCE=PASS")
          PY
      - name: Commit daily evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/phase_a/
          if git diff --cached --quiet; then
            echo "No new evidence to commit."
            exit 0
          fi
          git commit -m "chore: record Phase A shadow evidence"
          git push
