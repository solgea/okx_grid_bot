services:
  okx-grid-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: okx-grid-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      IS_DEMO: "true"
      DRY_RUN: "true"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import ccxt, pydantic, pydantic_settings"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
