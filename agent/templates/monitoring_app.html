<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engineering Agent Monitoring App</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #111827;
        --panel-2: #1f2937;
        --border: #374151;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --cyan: #22d3ee;
        --green: #34d399;
        --yellow: #fbbf24;
        --red: #f87171;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(135deg, #050b16, #111827 50%, #0f172a 100%);
        color: var(--text);
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px 26px;
        margin-bottom: 22px;
      }

      .topbar h1 {
        margin: 0;
        font-size: clamp(2rem, 2vw, 2.8rem);
        color: var(--cyan);
      }

      .topbar .meta {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .card {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 8px 22px rgba(0,0,0,0.18);
      }

      .card.success { border-left: 4px solid var(--green); }
      .card.warning { border-left: 4px solid var(--yellow); }
      .card.critical { border-left: 4px solid var(--red); }

      .label {
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 12px;
      }

      .value {
        font-size: clamp(1.3rem, 2vw, 1.8rem);
        font-weight: 700;
        color: var(--text);
      }

      .card.success .value { color: var(--green); }
      .card.warning .value { color: var(--yellow); }
      .card.critical .value { color: var(--red); }

      .section {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px 22px;
        margin-bottom: 24px;
      }

      .section h2 {
        margin: 0 0 16px 0;
        color: var(--cyan);
        font-size: 1.25rem;
      }

      .alerts {
        display: grid;
        gap: 12px;
      }

      .alert {
        border-left: 4px solid var(--yellow);
        border-radius: 10px;
        background: rgba(251, 191, 36, 0.08);
        padding: 14px 16px;
      }

      .alert.critical {
        border-left-color: var(--red);
        background: rgba(248, 113, 113, 0.08);
      }

      .alert-title {
        font-weight: 700;
        margin-bottom: 6px;
      }

      .alert.critical .alert-title { color: var(--red); }
      .alert.warning .alert-title { color: var(--yellow); }

      .alert-message {
        color: var(--text);
      }

      .alert-action {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .check-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
      }

      .check-item {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
      }

      .check-item.success {
        border-left: 4px solid var(--green);
      }

      .check-item.failed {
        border-left: 4px solid var(--red);
      }

      .check-icon {
        font-weight: 700;
        font-size: 1.2rem;
      }

      .check-item.success .check-icon { color: var(--green); }
      .check-item.failed .check-icon { color: var(--red); }

      .gate-track {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .gate {
        min-width: 80px;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(148, 163, 184, 0.08);
        color: var(--muted);
        font-weight: 700;
        text-align: center;
      }

      .gate.current {
        border-color: var(--cyan);
        color: var(--cyan);
        background: rgba(34, 211, 238, 0.08);
      }

      .gate.completed {
        border-color: var(--green);
        color: var(--green);
        background: rgba(52, 211, 153, 0.08);
      }

      .arrow {
        color: var(--cyan);
        font-size: 1.2rem;
        font-weight: 700;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      .metric {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
      }

      .metric-label {
        color: var(--muted);
        font-size: 0.76rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .metric-value {
        margin-top: 10px;
        font-size: 1.35rem;
        font-weight: 700;
      }

      .metric.success .metric-value { color: var(--green); }
      .metric.warning .metric-value { color: var(--yellow); }
      .metric.danger .metric-value { color: var(--red); }

      .links {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 12px;
      }

      .link-box {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
      }

      .link-title {
        color: var(--cyan);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 10px;
      }

      .link-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .link-item {
        display: block;
        background: rgba(34, 211, 238, 0.07);
        border: 1px solid rgba(34, 211, 238, 0.2);
        border-radius: 8px;
        padding: 8px 10px;
        color: var(--text);
        text-decoration: none;
      }

      .link-item:hover {
        background: rgba(34, 211, 238, 0.12);
      }

      .toolbar {
        display: flex;
        justify-content: flex-end;
        margin-top: 10px;
      }

      .refresh-btn {
        background: var(--cyan);
        color: #06212b;
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        font-weight: 700;
        cursor: pointer;
      }

      @media (max-width: 768px) {
        .container { padding: 16px; }
        .grid, .check-grid, .metric-grid, .links { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <h1>🤖 Monitoring App</h1>
        <div class="meta">Engineering Agent Health Dashboard</div>
      </header>

      <div id="timestamp" class="meta" style="text-align:right; margin-bottom:18px;">Loading...</div>

      <div id="quickStatus" class="grid"></div>

      <section class="section">
        <h2>🚨 Alerts</h2>
        <div id="alerts" class="alerts"></div>
      </section>

      <section class="section">
        <h2>📋 Daily Checks</h2>
        <div id="dailyChecks" class="check-grid"></div>
      </section>

      <section class="section">
        <h2>🎯 Gate Progress</h2>
        <div id="gateProgress" class="gate-track"></div>
      </section>

      <section class="section">
        <h2>🛡️ Safety Guards</h2>
        <div id="safetyGuards" class="check-grid"></div>
      </section>

      <section class="section">
        <h2>📊 Health Metrics</h2>
        <div id="healthMetrics" class="metric-grid"></div>
      </section>

      <section class="section">
        <h2>🔗 Quick Links</h2>
        <div id="quickLinks" class="links"></div>
      </section>

      <div class="toolbar">
        <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
      </div>
    </div>

    <script>
      async function loadData() {
        try {
          const res = await fetch('/api/data');
          const data = await res.json();
          render(data);
        } catch (e) {
          console.error('Load failed', e);
          document.getElementById('timestamp').textContent = 'Unable to load data';
        }
      }

      function render(data) {
        renderQuickStatus(data.quick_status);
        renderAlerts(data.alerts);
        renderChecks(data.daily_checks, 'dailyChecks');
        renderGateProgress(data.gate_progress);
        renderChecks(data.safety_guards, 'safetyGuards');
        renderMetrics(data.health_metrics);
        renderLinks(data.quick_links);
        document.getElementById('timestamp').textContent = `Updated: ${new Date(data.timestamp).toLocaleString('tr-TR')}`;
      }

      function renderQuickStatus(status) {
        const cards = [
          { label: 'Agent Status', value: status.agent_status, type: status.agent_status === 'BLOCKED' ? 'critical' : 'success' },
          { label: 'Phase', value: status.phase, type: 'default' },
          { label: 'Gate', value: status.gate, type: 'default' },
          { label: 'Live Trading', value: status.live_trading ? 'BLOCKED' : 'ALLOWED', type: status.live_trading ? 'success' : 'critical' },
          { label: 'Auto Merge', value: status.auto_merge ? 'BLOCKED' : 'ALLOWED', type: status.auto_merge ? 'success' : 'critical' },
          { label: 'Last CI', value: status.ci_status, type: status.ci_status === 'SUCCESS' ? 'success' : status.ci_status === 'FAILURE' ? 'critical' : 'warning' },
        ];

        const html = cards.map(card => {
          const classes = ['card'];
          if (card.type === 'success') classes.push('success');
          if (card.type === 'warning') classes.push('warning');
          if (card.type === 'critical') classes.push('critical');

          return `
            <div class="${classes.join(' ')}">
              <div class="label">${card.label}</div>
              <div class="value">${card.value}</div>
            </div>
          `;
        }).join('');

        document.getElementById('quickStatus').innerHTML = html;
      }

      function renderAlerts(alerts) {
        if (!alerts || alerts.length === 0) {
          document.getElementById('alerts').innerHTML = '<div class="alert success"><div class="alert-title">Healthy</div><div class="alert-message">No alerts detected.</div></div>';
          return;
        }

        const html = alerts.map(alert => `
          <div class="alert ${alert.severity}">
            <div class="alert-title">${alert.title}</div>
            <div class="alert-message">${alert.message}</div>
            <div class="alert-action">Action: ${alert.action}</div>
          </div>
        `).join('');

        document.getElementById('alerts').innerHTML = html;
      }

      function renderChecks(items, containerId) {
        const html = items.map(item => {
          const cls = item.status ? 'success' : 'failed';
          const icon = item.status ? '✓' : '✗';
          return `
            <div class="check-item ${cls}">
              <div class="check-icon">${icon}</div>
              <div>${item.name}</div>
            </div>
          `;
        }).join('');

        document.getElementById(containerId).innerHTML = html;
      }

      function renderGateProgress(items) {
        const html = items.map((item, idx) => {
          const arrow = idx === 0 ? '' : '<span class="arrow">→</span>';
          return `${arrow}<div class="gate ${item.status}">${item.gate}</div>`;
        }).join('');
        document.getElementById('gateProgress').innerHTML = html;
      }

      function renderMetrics(metrics) {
        const entries = [
          { label: 'Agent Status', value: metrics.agent_status, type: 'success' },
          { label: 'CI Health', value: metrics.ci_health, type: metrics.ci_health === 'SUCCESS' ? 'success' : 'warning' },
          { label: 'Safety Status', value: metrics.safety_status, type: metrics.safety_status === 'GREEN' ? 'success' : 'danger' },
          { label: 'Gate Progress', value: metrics.gate_progress, type: 'success' },
        ];

        const html = entries.map(item => `
          <div class="metric ${item.type}">
            <div class="metric-label">${item.label}</div>
            <div class="metric-value">${item.value}</div>
          </div>
        `).join('');

        document.getElementById('healthMetrics').innerHTML = html;
      }

      function renderLinks(links) {
        const groups = [
          {
            title: 'Files',
            items: [
              { name: 'STATE.md', url: links.state_md },
              { name: 'REPORT.md', url: links.report_md },
              { name: 'GATE_PLAN.md', url: links.gate_plan_md },
            ],
          },
          {
            title: 'External',
            items: [
              { name: 'PR #2', url: links.pr },
              { name: 'GitHub Actions', url: links.ci },
              { name: 'Repo', url: links.repo },
            ],
          },
        ];

        const html = groups.map(group => `
          <div class="link-box">
            <div class="link-title">${group.title}</div>
            <div class="link-list">
              ${group.items.map(item => `<a class="link-item" href="${item.url}" target="_blank">${item.name}</a>`).join('')}
            </div>
          </div>
        `).join('');

        document.getElementById('quickLinks').innerHTML = html;
      }

      loadData();
      setInterval(loadData, 30000);
    </script>
  </body>
</html>
